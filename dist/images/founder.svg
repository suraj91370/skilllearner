<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B4F4A" />
      <stop offset="50%" stop-color="#083e3a" />
      <stop offset="100%" stop-color="#0A6B5C" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0B4F4A" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="480" fill="url(#bgGrad)" />
  <circle cx="200" cy="180" r="160" fill="url(#glow)" />
  
  <!-- Subtle Grid Accent -->
  <circle cx="200" cy="170" r="95" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-dasharray="6 6" />
  
  <!-- Silhouette Icon -->
  <circle cx="200" cy="155" r="50" fill="#E2E8F0" opacity="0.9" />
  <path d="M120 310 C120 240, 160 225, 200 225 C240 225, 280 240, 280 310 Z" fill="#E2E8F0" opacity="0.9" />
  
  <!-- Founder Star Badge -->
  <circle cx="200" cy="90" r="22" fill="url(#goldGrad)" />
  <path d="M200 78 L203.5 86 L212 87 L205.5 93 L207.5 101 L200 96.5 L192.5 101 L194.5 93 L188 87 L196.5 86 Z" fill="#FFFFFF" />
  
  <!-- Text Label -->
  <rect x="70" y="360" width="260" height="52" rx="26" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" />
  <text x="200" y="392" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="1">FOUNDER &amp; CEO</text>
  <text x="200" y="440" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">Photo placeholder</text>
</svg>
